<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Opening Reel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800;900&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
  :root { --ink:#0E1724; --panel:#152234; --line:#26364D; --paper:#EEF1F4; --muted:#9AA8BA; --hazard:#F2B33D; --sensor:#5CC8D6; --alarm:#E8664A; color-scheme: dark; }
  html, body { margin:0; height:100%; background:var(--ink); color:var(--paper); font-family:'Instrument Sans', system-ui, sans-serif; }
  body { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; overflow:hidden; }
  #c { display:block; width:min(100vw, calc((100vh - 64px) * 16 / 9)); aspect-ratio:16/9; background:var(--ink); }
  [hidden] { display:none !important; }
  #bar { display:flex; align-items:center; gap:14px; width:min(100vw, calc((100vh - 64px) * 16 / 9)); padding:0 16px; box-sizing:border-box; }
  #bar button { font:600 14px 'JetBrains Mono', ui-monospace, monospace; background:var(--panel); color:var(--paper); border:1px solid var(--line); border-radius:8px; padding:8px 14px; cursor:pointer; min-width:84px; }
  #bar button:focus-visible, #scrub:focus-visible { outline:2px solid var(--hazard); outline-offset:2px; }
  #track { position:relative; flex:1; display:flex; align-items:center; }
  #scrub { width:100%; accent-color:var(--hazard); }
  .stopmark { position:absolute; top:-9px; width:9px; height:9px; background:var(--hazard); transform:translateX(-50%) rotate(45deg); pointer-events:none; }
  #auto { font:400 14px 'Instrument Sans', system-ui, sans-serif; color:var(--muted); display:flex; gap:6px; align-items:center; white-space:nowrap; }
  #stage { position:relative; }
  #card { position:absolute; left:2.5%; bottom:9%; width:min(60%, 760px); box-sizing:border-box;
          background:rgba(14,23,36,0.92); border:1px solid var(--line); border-left:6px solid var(--hazard); border-radius:12px; padding:18px 22px; }
  #card h2 { margin:0 0 6px; font:800 clamp(16px, 2.2vw, 30px)/1.15 Archivo, Arial, sans-serif; color:var(--paper); }
  #card p { margin:0; font:400 clamp(13px, 1.4vw, 19px)/1.4 'Instrument Sans', system-ui, sans-serif; color:var(--muted); }
  #card .go { margin-top:10px; font:600 clamp(12px, 1.1vw, 15px) 'JetBrains Mono', ui-monospace, monospace; color:var(--hazard); }
  #time { font:400 14px 'JetBrains Mono', ui-monospace, monospace; color:var(--muted); font-variant-numeric:tabular-nums; min-width:110px; text-align:right; }
  video { display:none; }
  body.render { display:block; }
  body.render #c { width:1920px; height:1080px; }
  body.render #bar, body.render #card { display:none; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="c" width="1920" height="1080" aria-label="Opening reel: robots learning to act in simulation"></canvas>
  <div id="card" hidden role="status" aria-live="polite"><h2 id="cardTitle"></h2><p id="cardWhy"></p><p class="go">Press Play or Space to continue</p></div>
</div>
<div id="bar">
  <button id="play" type="button">Play</button>
  <div id="track"><input id="scrub" type="range" min="0" max="60" step="0.01" value="0" aria-label="Timeline"></div>
  <label id="auto"><input id="autostop" type="checkbox" checked> Pause at key moments</label>
  <span id="time">0.00</span>
</div>

   Beat times are seconds from the scene's own start.
   render.mjs and sound.mjs read this same block.
   ====================================================================== */

  text(c.chipNote, 1020, 952, { kind: 'mono', size: 20, color: 'muted', alpha: easeOut(prog(u, B.chips + 0.36, B.chips + 0.76)) });
}

/* ===== scene: rl (residual RL release gate on the frozen night-1 policy; sealed paired eval) ===== */
function drawRL(u) {
  const c = COPY.rl, B = SC.rl.beats;
  grid(0.2);
  eyebrow(c.eyebrow, 120, 120, easeOut(prog(u, 0, 0.4)));
  kinetic(c.title, 120, 200, u, 0.05, { size: 72, weight: 800 });
  text(c.sub, 120, 254, { size: 28, color: 'muted', alpha: easeOut(prog(u, B.sub, B.sub + 0.4)) });
  const pw = 760, ph = 380, py = 300, xs = [120, 1040];
  SC.rl.clips.forEach((clip, i) => {
    clipPanel(clip, u, xs[i], py, pw, ph);
    const [lab, colr] = c.labels[i];
    if (i === 1 && clip.from + u * clip.rate >= vdur(clip.video) - 0.05) {
      ctx.save(); ctx.strokeStyle = rgba('hazard', 0.75 + 0.25 * Math.sin(u * 5)); ctx.lineWidth = 6; rr(xs[i] - 6, py - 6, pw + 12, ph + 12, 22); ctx.stroke(); ctx.restore();
    }
    text(lab, xs[i], py + ph + 44, { kind: 'mono', size: 24, weight: 600, color: colr, spacing: 2, alpha: easeOut(prog(u, B.labels + i * 0.15, B.labels + 0.4 + i * 0.15)) });
  });
  text(c.same, xs[1] + pw, py - 16, { kind: 'mono', size: 18, color: 'muted', align: 'right', alpha: easeOut(prog(u, 0.3, 0.7)) });
  // sealed eval: strict places, base vs base + gate, per split
  const BX = 560, BW = 1000;
  c.rows.forEach((r, i) => {
    const t0 = i ? B.row2 : B.row1, y0 = 774 + i * 112, a = easeOut(prog(u, t0 - 0.1, t0 + 0.3));
    if (a <= 0) return;
    ctx.save(); ctx.globalAlpha *= a;
    text(r.label, 120, y0 + 40, { kind: 'display', size: 36, weight: 800 });
    [[r.base, 'muted', c.baseTag, 0], [r.rl, 'hazard', c.rlTag, 1]].forEach(([v, colr, tag, j]) => {
      const by = y0 + j * 34, bk = easeOut(prog(u, t0 + j * 0.2, t0 + 0.8 + j * 0.2));
      rr(BX, by, BW, 24, 6); ctx.fillStyle = rgba('line', 0.6); ctx.fill();
      const bw = Math.max(6, BW * (v / r.of) * bk);
      rr(BX, by, bw, 24, 6); ctx.fillStyle = col(colr); ctx.fill();
      text(`${Math.round(v * bk)} / ${r.of}`, BX + BW + 20, by + 21, { kind: 'mono', size: 26, weight: 600, color: j ? 'hazard' : 'paper' });
      text(tag, BX - 16, by + 19, { kind: 'mono', size: 18, color: 'muted', align: 'right' });
    });
    ctx.restore();
  });
}

/* ===== scene: checker (a local VLM's answers vs the simulator's ground truth) ===== */
function drawChecker(u) {
  const c = COPY.checker, B = SC.checker.beats;
  grid(0.2);
  eyebrow(c.eyebrow, 120, 120, easeOut(prog(u, 0, 0.4)));
  kinetic(c.title, 120, 200, u, 0.05, { size: 64, weight: 800 });
  text(`Asked: “${c.question}”`, 120, 258, { size: 30, weight: 600, color: 'sensor', alpha: easeOut(prog(u, 0.3, 0.7)) });
  const iw = 560, ih = 280, ix = 120, iys = [340, 690];
  c.cards.forEach((cd, i) => {
    const t0 = i ? B.cardB : B.cardA, k = easeOut(prog(u, t0, t0 + 0.4)), y = iys[i] + (1 - k) * 30;
    if (k <= 0) return;
    ctx.save(); ctx.globalAlpha *= k;
    text(cd.label, ix, y - 14, { kind: 'mono', size: 20, weight: 600, color: 'muted', spacing: 2 });
    const im = IMGS[i ? 'chkBad' : 'chkOk'];
    rr(ix, y, iw, ih, 12); ctx.save(); ctx.clip();
    if (im.complete && im.naturalWidth) ctx.drawImage(im, ix, y, iw, ih); else { ctx.fillStyle = C.panel; ctx.fillRect(ix, y, iw, ih); }
    ctx.restore();
    rr(ix, y, iw, ih, 12); ctx.strokeStyle = C.line; ctx.lineWidth = 2; ctx.stroke();
    const tw = measure(cd.truth, 'mono', 20, 600, 2);
    rr(ix + 12, y + ih - 52, tw + 28, 40, 8); ctx.fillStyle = rgba('ink', 0.88); ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = col(cd.truthColor); ctx.stroke();
    text(cd.truth, ix + 26, y + ih - 25, { kind: 'mono', size: 20, weight: 600, color: cd.truthColor, spacing: 2 });
    ctx.restore();
    const ta = i ? B.ansB : B.ansA;
    cd.answers.forEach(([who, ans, right], j) => {
      const ak = prog(u, ta + j * 0.18, ta + j * 0.18 + 0.3); if (ak <= 0) return;
      const ax = ix + iw + 36, ay = y + 50 + j * 116;
      text(who, ax, ay, { kind: 'mono', size: 22, color: 'muted', alpha: clamp(ak * 2) });
      const w = slamText(`“${ans}”`, ax, ay + 44, ak * 0.32, { kind: 'display', size: 40, weight: 800, color: right ? 'paper' : 'alarm' });
      mark(ax + w + 30, ay + 30, right, clamp(ak * 2));
      if (!right) text('false “done”', ax, ay + 76, { kind: 'mono', size: 18, weight: 600, color: 'alarm', alpha: clamp(ak * 2) });
    });
  });
  // the measured table
  const TX = 980, cols = [1440, 1630, 1800], ta = easeOut(prog(u, B.table, B.table + 0.4));
  text(c.tableHead, TX, 372, { kind: 'mono', size: 20, weight: 600, color: 'muted', spacing: 1, alpha: ta });
  c.cols.forEach((h, j) => text(h, cols[j], 424, { kind: 'mono', size: 20, color: 'muted', align: 'right', alpha: ta }));
  ctx.save(); ctx.globalAlpha *= ta; ctx.strokeStyle = C.line; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(TX, 444); ctx.lineTo(1800, 444); ctx.stroke(); ctx.restore();
  c.rows.forEach(([name, acc, fd, lat], r) => {
    const rk = easeOut(prog(u, r ? B.rowQ : B.rowG, (r ? B.rowQ : B.rowG) + 0.35)), y = 510 + r * 82;
    ctx.save(); ctx.globalAlpha *= rk; ctx.translate((1 - rk) * 30, 0);
    text(name, TX, y, { kind: 'display', size: 40, weight: 800 });
    text(acc, cols[0], y, { kind: 'mono', size: 38, weight: 600, color: 'sensor', align: 'right' });
    text(fd, cols[1], y, { kind: 'mono', size: 38, weight: 600, color: 'hazard', align: 'right' });
    text(lat, cols[2], y, { kind: 'mono', size: 38, weight: 600, color: 'muted', align: 'right' });
    ctx.restore();
  });
  ctx.save(); ctx.globalAlpha *= easeOut(prog(u, B.note, B.note + 0.4));
  wrap(c.note, TX, 700, 820, 42, { size: 30, color: 'paper' }); ctx.restore();
  kinetic(c.lesson, TX, 930, u, B.lesson, { size: 64, weight: 900, color: 'hazard' });
}

/* ===== scene: tuned (QLoRA fine-tune of the checker: base vs tuned, same harness) ===== */
function drawTuned(u) {
  const c = COPY.tuned, B = SC.tuned.beats;
  grid(0.2);
  eyebrow(c.eyebrow, 128, 140, easeOut(prog(u, 0, 0.3)));
  text(c.footnote, 1792, 140, { kind: 'mono', size: 20, color: 'muted', align: 'right', alpha: easeOut(prog(u, 0.2, 0.6)) });
  const BX = 640, BW = 860, starts = [B.row1, B.row2, B.row3], ys = [250, 490, 730];
  const focus = [1 - 0.4 * easeOut(prog(u, B.row2, B.row2 + 0.4)), 1, 1];
  c.groups.forEach((g, gi) => {
    const t0 = starts[gi], gy = ys[gi], lit = easeOut(prog(u, t0 - 0.1, t0 + 0.25)), a = lerp(0.32, 1, lit) * focus[gi];
    text(g.title, 128, gy, { kind: 'display', size: 44, weight: 800, alpha: a });
    g.rows.forEach(([label, val, color], i) => {
      const ry = gy + 40 + i * 62;
      text(label, 128, ry + 36, { kind: 'mono', size: 28, color: 'muted', alpha: a });
      rr(BX, ry, BW, 46, 8); ctx.fillStyle = rgba('line', 0.35 + 0.3 * lit); ctx.fill();
      const bk = easeOut(prog(u, t0 + i * 0.15, t0 + 0.9 + i * 0.15));
      if (bk <= 0) return;
      const bw = Math.max(6, BW * (val / g.max) * bk);
      ctx.save(); ctx.globalAlpha *= focus[gi];
      rr(BX, ry, bw, 46, 8); ctx.fillStyle = col(color); ctx.fill();
      text(`${Math.round(val * bk)} of ${g.max}`, BX + bw + 18, ry + 36, { kind: 'mono', size: 32, weight: 600 });
      ctx.restore();
    });
  });
  const fl = prog(u, B.flash, B.flash + 0.5);
  if (fl > 0 && fl < 1) { ctx.fillStyle = rgba('alarm', 0.14 * (1 - fl)); ctx.fillRect(0, 0, W, H); }
  kinetic(c.lesson, 128, 984, u, B.lesson, { size: 64, weight: 900, color: 'hazard' });
}

/* ===== scene: imagine ===== */
function drawImagine(u) {
  const c = COPY.imagine;
  grid(0.2);
  eyebrow(c.eyebrow, 128, 250, easeOut(prog(u, 0, 0.35)));
  c.title.forEach((line, i) => kinetic(line, 128, 370 + i * 100, u, 0.1 + i * 0.15, { size: 88, weight: 900, color: i === 2 ? 'hazard' : 'paper' }));
  ctx.save(); ctx.globalAlpha *= easeOut(prog(u, 0.8, 1.2)); wrap(c.body, 128, 740, 600, 46, { size: 32, color: 'muted' }); ctx.restore();
  const pw = 460, ph = 388, py = 330, xs = [860, 1360], draws = clipDraws(SC.imagine.clips[0], u);
  [[c.real, 0, 'paper'], [c.imagined, 540, 'hazard']].forEach(([label, sy0, color], i) => {
    const k = easeOut(prog(u, 0.1 + i * 0.15, 0.5 + i * 0.15)), yy = py + (1 - k) * 40;
    ctx.save(); ctx.globalAlpha *= k;
    text(label.toUpperCase(), xs[i], yy - 24, { kind: 'mono', size: 26, weight: 600, color, spacing: 3 });
    rr(xs[i], yy, pw, ph, 14); ctx.save(); ctx.clip();
    for (const d of draws) { ctx.save(); ctx.globalAlpha *= d.a; drawVideo(d.id, 0, sy0, 640, 540, xs[i], yy, pw, ph); ctx.restore(); }
    ctx.restore();
    rr(xs[i], yy, pw, ph, 14); ctx.strokeStyle = col(i ? 'hazard' : 'line'); ctx.lineWidth = i ? 4 : 2; ctx.stroke();
    ctx.restore();
  });
  text(c.credit, 860, py + ph + 70, { kind: 'mono', size: 22, color: 'muted', alpha: easeOut(prog(u, 0.9, 1.3)) });
}

/* ===== scene: close ===== */
function drawClose(u) {
  const c = COPY.close;
  for (let i = 0; i < 7; i++) {
    const r = (u * 160 + i * 160) % 1120;
    ctx.beginPath(); ctx.arc(W / 2, H / 2 - 40, r, 0, Math.PI * 2);
    ctx.strokeStyle = rgba('sensor', 0.24 * (1 - r / 1120)); ctx.lineWidth = 2; ctx.stroke();
  }
  kinetic(c.line1, W / 2, 470, u, 0.2, { size: 156, weight: 900, align: 'center' });
  kinetic(c.line2, W / 2, 630, u, 0.45, { size: 156, weight: 900, align: 'center', color: 'hazard', stagger: 0.12 });
  text(c.sub, W / 2, 750, { size: 40, color: 'muted', align: 'center', alpha: easeOut(prog(u, 1.2, 1.6)) });
  text(c.credit, W / 2, 900, { size: 22, color: 'muted', align: 'center', alpha: 0.85 * easeOut(prog(u, 1.6, 2.0)) });
}

const DRAW = { plaza: drawPlaza, crowd: drawCrowd, worlds: drawWorlds, reward: drawReward, curves: drawCurves,
               denominator: drawDenominator, arm: drawArm, grip: drawGrip, letgo: drawLetGo, rl: drawRL, checker: drawChecker, tuned: drawTuned,
               imagine: drawImagine, close: drawClose };

// Each scene paints its own ground. The incoming scene crossfades in over the outgoing one with a small push;
// every scene also pushes in slowly for its whole length, so nothing is ever perfectly still.
function draw(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1;
  ctx.fillStyle = C.ink; ctx.fillRect(0, 0, W, H);
  const scenes = activeScenes(t), f = TIMELINE.fade, lastScene = TIMELINE.scenes[TIMELINE.scenes.length - 1];
  scenes.forEach((s, idx) => {
    const u = t - s.start;
    const inK = s === TIMELINE.scenes[0] ? 1 : easeInOut(prog(u, 0, f));
    const outK = s === lastScene ? 0 : prog(t, s.end - f, s.end);
    const hk = s.stop ? prog(u, s.stop.at, s.stop.at + s.stop.hold) : 0;
    const sc = 1 + (s.push ?? TIMELINE.push) * (u / s.len) + 0.012 * easeInOut(hk) + 0.035 * (1 - inK) + 0.03 * easeInOut(outK);
    ctx.save();
    ctx.globalAlpha = idx === 0 ? 1 : inK;
    ctx.fillStyle = C.ink; ctx.fillRect(0, 0, W, H);
    ctx.translate(W / 2, H / 2); ctx.scale(sc, sc); ctx.translate(-W / 2, -H / 2);
    DRAW[s.id](contentTime(s, u));
    ctx.restore();
  });
  drawChapters(t);
  const fo = prog(t, TIMELINE.duration - 0.8, TIMELINE.duration);     // final fade
  if (fo > 0) { ctx.fillStyle = rgba('ink', fo); ctx.fillRect(0, 0, W, H); }
}

// Chapter line: always on (after the cold open), so the viewer can always see the reel is playing.
function drawChapters(t) {
  const ch = TIMELINE.chapters, a = easeOut(prog(t, ch.show, ch.show + 0.5)); if (a <= 0) return;
  const S = TIMELINE.scenes, X0 = 80, X1 = 1840, Y = ch.y, gap = 6, D = TIMELINE.duration;
  const segEnd = i => (i < S.length - 1 ? S[i + 1].start : D), X = tt => lerp(X0, X1, tt / D);
  ctx.save(); ctx.globalAlpha = a;
  S.forEach((s, i) => {
    const x0 = X(s.start) + (i ? gap / 2 : 0), x1 = X(segEnd(i)) - (i < S.length - 1 ? gap / 2 : 0);
    const cur = t >= s.start && t < segEnd(i), past = t >= segEnd(i);
    rr(x0, Y, x1 - x0, 6, 3); ctx.fillStyle = past ? rgba('paper', 0.45) : rgba('line', 0.95); ctx.fill();
    if (cur) { const k = (t - s.start) / (segEnd(i) - s.start); rr(x0, Y, Math.max(6, (x1 - x0) * k), 6, 3); ctx.fillStyle = C.hazard; ctx.fill(); }
    if (s.chapter) {                    // shrink a label that would run into the next one (short segments)
      let fs = 17; while (fs > 12 && measure(s.chapter, 'mono', fs, 600) > x1 - x0 - 6) fs--;
      text(s.chapter, x0, Y - 12, { kind: 'mono', size: fs, weight: cur ? 600 : 400, color: cur ? 'hazard' : 'muted', alpha: cur ? 1 : 0.75 });
    }
  });
  TIMELINE.stops.forEach(st => {        // stop points: diamonds that pulse while their beat is held
    const on = t >= st.from && t < st.to, ph = on ? 0.5 + 0.5 * Math.sin((t - st.from) * 9) : 0, r = 6 + 3 * ph;
    ctx.save(); ctx.translate(X(st.t), Y - 4); ctx.rotate(Math.PI / 4);
    ctx.fillStyle = on ? C.hazard : t > st.to ? rgba('paper', 0.85) : C.muted; ctx.fillRect(-r, -r, 2 * r, 2 * r);
    ctx.lineWidth = 2; ctx.strokeStyle = C.ink; ctx.strokeRect(-r, -r, 2 * r, 2 * r); ctx.restore();
    if (on) { ctx.beginPath(); ctx.arc(X(st.t), Y - 4, 12 + 16 * ((t - st.from) % 0.7) / 0.7, 0, Math.PI * 2);
      ctx.strokeStyle = rgba('hazard', 0.6 * (1 - ((t - st.from) % 0.7) / 0.7)); ctx.lineWidth = 2; ctx.stroke(); }
  });
  const px = X(t);
  ctx.beginPath(); ctx.arc(px, Y + 3, 7, 0, Math.PI * 2); ctx.fillStyle = C.paper; ctx.fill();
  ctx.lineWidth = 2; ctx.strokeStyle = C.ink; ctx.stroke();
  ctx.restore();
}

/* --- deterministic render API (render.mjs) --- */
function sceneDraws(t) {
  const out = [];
  for (const s of activeScenes(t)) for (const clip of (s.clips || [])) out.push(...clipDraws(clip, contentTime(s, t - s.start)));
  return out;
}
window.renderAt = async function (t) {
  await Promise.all(sceneDraws(t).map(d => seekTo(VIDS[d.id], d.ct)));
  draw(t);
};
window.TIMELINE = TIMELINE;
window.reelReady = (async () => {
  const loads = [['display', 900], ['display', 800], ['display', 700], ['body', 400], ['body', 600], ['mono', 400], ['mono', 600]]
    .map(([k, w]) => document.fonts.load(font(k, 64, w)).catch(() => {}));
  await Promise.all(loads); await document.fonts.ready;
  await Promise.all(Object.values(VIDS).map(v => v.readyState >= 2 ? 0 : new Promise(r => { v.addEventListener('loadeddata', r, { once: true }); v.addEventListener('error', r, { once: true }); })));
  await Promise.all(Object.values(IMGS).map(im => im.complete ? 0 : new Promise(r => { im.addEventListener('load', r, { once: true }); im.addEventListener('error', r, { once: true }); })));
  return true;
})();

/* --- live player (normal browser): videos stay paused and are seeked to the timeline --- */
if (!RENDER) {
  const play = document.getElementById('play'), scrub = document.getElementById('scrub'), timeEl = document.getElementById('time');
  const card = document.getElementById('card'), autostop = document.getElementById('autostop');
  scrub.max = TIMELINE.duration;
  for (const st of TIMELINE.stops) {     // stop diamonds on the scrubber
    const m = document.createElement('span'); m.className = 'stopmark'; m.title = st.title;
    m.style.left = `calc(8px + (100% - 16px) * ${st.t / TIMELINE.duration})`; document.getElementById('track').appendChild(m);
  }
  let t = 0, playing = false, last = null;
  function showCard(st) { card.hidden = !st; if (st) { document.getElementById('cardTitle').textContent = st.title; document.getElementById('cardWhy').textContent = st.why; } }
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  function syncVideos() {
    for (const d of sceneDraws(t)) { const v = VIDS[d.id]; if (!v.seeking && Math.abs(v.currentTime - d.ct) > 0.02) v.currentTime = d.ct; }
  }
  function ui() { scrub.value = t; timeEl.textContent = `${t.toFixed(2)} / ${TIMELINE.duration.toFixed(2)}`; play.textContent = playing ? 'Pause' : 'Play'; }
  function frame(now) {
    if (playing) {
      const prev = t;
      if (last != null) t += (now - last) / 1000;
      const hit = autostop.checked && TIMELINE.stops.find(st => prev < st.t && t >= st.t);
      if (hit) { t = hit.t; playing = false; showCard(hit); }
      if (t >= TIMELINE.duration) { t = TIMELINE.duration - 0.001; playing = false; }
    }
    last = now; syncVideos(); draw(t); ui();
    requestAnimationFrame(frame);
  }
  function toggle() { if (t >= TIMELINE.duration - 0.01) t = 0; playing = !playing; last = null; if (playing) { showCard(null); t += 0.001; } }
  play.addEventListener('click', toggle);
  scrub.addEventListener('input', () => { t = parseFloat(scrub.value); showCard(null); });
  addEventListener('keydown', e => {
    if (e.code === 'Space') { e.preventDefault(); toggle(); }
    else if (e.code === 'ArrowRight') t = Math.min(TIMELINE.duration - 0.001, t + (e.shiftKey ? 0.1 : 2));
    else if (e.code === 'ArrowLeft') t = Math.max(0, t - (e.shiftKey ? 0.1 : 2));
    else if (e.code === 'Home') t = 0;
  });
  window.reelReady.then(() => { if (reduce) t = TIMELINE.still; requestAnimationFrame(frame); });
}
