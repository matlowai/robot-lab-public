[project]
name = "patrol-lab"
version = "0.0.1"
description = "Simulated Spot + humanoid patrol: facts in, explainable incidents out."
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6",
    "jsonschema>=4.22",
    "numpy>=2.5.3",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
